name: Recorrido visual (GitHub Pages)

# Publica solo demo/recorrido/ (página estática con datos ficticios, ADR-048).
# No despliega la API ni ningún otro fichero del repositorio.

on:
  push:
    branches: [main]
    paths:
      - 'demo/recorrido/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar recorrido
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir demo/recorrido
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/recorrido

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
