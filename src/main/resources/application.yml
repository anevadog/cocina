spring:
  application:
    name: cocina-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:cocina}
    username: ${POSTGRES_USER:cocina}
    password: ${POSTGRES_PASSWORD:cambiar_en_local}
    hikari:
      maximum-pool-size: 10
  jpa:
    # El esquema solo lo cambia Flyway: Hibernate únicamente valida.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Instantes en UTC, independientemente de la zona de la máquina (PLA-06).
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    datatype:
      datetime:
        # PLA-06: fechas ISO 8601, nunca epoch. En Jackson 3 (Boot 4) esta bandera vive en
        # DateTimeFeature, no en SerializationFeature. Las cantidades y el dinero se escriben
        # siempre con BigDecimal y escala fija: nunca en notación científica.
        write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    # PLA-02: cuerpo de error propio; no se usa ProblemDetail de Spring.
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

cocina:
  # Establecimiento activo. El MVP es de un solo establecimiento: el id se resuelve aquí y se
  # propaga a todas las operaciones y a los tokens.
  establishment:
    id: ${ESTABLISHMENT_ID:1}
    name: ${ESTABLISHMENT_NAME:Cocina}
    timezone: ${APP_TIMEZONE:Europe/Madrid}
    currency: EUR
  security:
    jwt:
      # Sin secreto la API no arranca (ver SecurityConfig). Nunca debe haber un valor por defecto
      # en el perfil por defecto: un secreto conocido permitiría firmar tokens válidos.
      secret: ${JWT_SECRET:}
      access-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-ttl: ${JWT_REFRESH_TTL:30d}
    login:
      max-failed-attempts: 5
      lock-duration: 15m
  bootstrap:
    # El primer administrador solo se crea si hay contraseña y no existe ningún usuario.
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  # NFR-OBS-01: logs estructurados (JSON) con el requestId del MDC en cada línea.
  structured:
    format:
      console: ecs
  level:
    root: INFO
