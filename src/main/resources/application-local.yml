# Perfil de desarrollo local.
# Arranque: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#
# Los valores de esta sección son DELIBERADAMENTE inseguros y solo existen para que el entorno
# local arranque sin configuración manual. Nunca se usa este perfil en producción.
cocina:
  security:
    jwt:
      # Solo desarrollo: 48 caracteres repetidos, longitud suficiente para HS256.
      secret: ${JWT_SECRET:local-development-only-secret-change-me-0123456789}
  bootstrap:
    # Contraseña de desarrollo para el primer administrador. Cámbiala antes de usar datos reales.
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:cambiar_en_local}

springdoc:
  # Ayudas solo para la demo local: no afectan a `prod`, donde springdoc está apagado.
  swagger-ui:
    # El token de Authorize sobrevive a una recarga de la página.
    persist-authorization: true
    # Endpoints y etiquetas en orden alfabético: más fácil de recorrer en una demostración.
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    # Los modelos ocupan mucho y no aportan nada al guion.
    default-models-expand-depth: -1

logging:
  level:
    root: INFO
    com.killa.cocina: DEBUG
