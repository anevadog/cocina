# Perfil de tests automatizados.
spring:
  main:
    banner-mode: off

cocina:
  security:
    jwt:
      # Secreto de test, público a propósito: no protege nada real.
      secret: test-only-secret-for-integration-tests-0123456789
      access-ttl: 15m
      refresh-ttl: 30d
    login:
      max-failed-attempts: 5
      lock-duration: 15m
  bootstrap:
    # Sin contraseña: los tests crean sus propios usuarios de forma explícita.
    admin-password: ""

logging:
  level:
    root: WARN
    com.killa.cocina: INFO
    # Un test provoca un 5xx a propósito para verificar que no se filtra detalle interno;
    # su traza completa ensuciaría la salida del build sin aportar nada.
    com.killa.cocina.shared.error.GlobalExceptionHandler: OFF
